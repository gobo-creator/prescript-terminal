<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111" />
  <title>PRESCRIPT Prototype</title>
  <link rel="stylesheet" href="style_iphone_fixed.css" />
  <link rel="stylesheet" href="presets.css" />

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PRESCRIPT">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PROTOTYPE / PRESCRIPT TERMINAL</p>
        <h1>PRESCRIPT</h1>
      </div>
      <div class="topbar-actions">
        <button id="soundButton" class="sound-button" type="button" aria-pressed="true">SOUND ON</button>
        <button id="settingsButton" class="icon-button" aria-label="指令管理">＋</button>
      </div>
    </header>

    <main>
      <section class="terminal-panel">
        <div class="status-row">
          <span class="status-dot"></span>
          <span id="systemStatus">SYSTEM READY</span>
        </div>

        <div id="idleView" class="view active">
          <p class="small-label">NEXT PRESCRIPT</p>
          <h2>指令を受領せよ。</h2>
          <p class="subtext">端末を起動し、次の指令を受領してください。</p>

          <button id="receiveButton" class="device-button" aria-label="指令を受領する">
            <span class="device-shell">
              <span class="device-top-strip"></span>
              <span class="device-screen-wrap">
                <span id="deviceDisplay" class="device-display">****</span>
              </span>
              <span class="device-edge device-edge-a"></span>
              <span class="device-edge device-edge-b"></span>
            </span>
            <span class="device-caption">RECEIVE PRESCRIPT</span>
          </button>

          <div class="stats">
            <div>
              <span id="commandCount">0</span>
              <small>登録指令</small>
            </div>
            <div>
              <span id="historyCount">0</span>
              <small>受領記録</small>
            </div>
          </div>
        </div>

        <div id="decodingView" class="view">
          <p id="terminalModeLabel" class="small-label">DECODING</p>

          <div class="css-terminal-stage decoding-stage">
            <div class="css-terminal decoding-terminal">
              <div class="terminal-wing wing-left"></div>
              <div class="terminal-wing wing-right"></div>

              <div class="terminal-body">
                <div class="terminal-top-armor">
                  <span class="armor-segment a1"></span>
                  <span class="armor-segment a2"></span>
                  <span class="armor-segment a3"></span>
                </div>

                <div class="terminal-screen-frame">
                  <div class="terminal-screen decoding-screen">
                    <div class="screen-scan"></div>
                    <div class="screen-head">
                      <span id="screenTitle">// ANALYZING</span>
                      <span id="decodingPhase" class="screen-code">INITIALIZE</span>
                    </div>

                    <div class="screen-command-wrap">
                      <span class="screen-arrow">›</span>
                      <div id="candidateText" class="screen-command decoding-command code-matrix">
                        <div>****-****-****-****</div>
                        <div>---- ---- ---- ----</div>
                      </div>
                      <p id="resultText" class="screen-command seamless-result" aria-live="polite"></p>
                    </div>

                    <div class="screen-rule"></div>
                    <div id="screenFoot" class="screen-foot">PRESCRIPT ENGINE ACTIVE</div>
                  </div>
                </div>

                <div class="terminal-bottom-armor">
                  <span></span><span></span><span></span>
                </div>
              </div>
            </div>
          </div>

          <div id="analysisProgress" class="progress-track">
            <div id="progressBar" class="progress-bar"></div>
          </div>
          <p id="decodingText" class="candidate-text">指令を解析中...</p>

          <div id="resultActions" class="result-actions seamless-actions">
            <button id="completeButton" class="secondary-button">遂行済みにする</button>
            <button id="retryButton" class="primary-button">次の指令を受領</button>
          </div>
        </div>
      </section>

      <section class="history-panel">
        <div class="section-heading">
          <div>
            <p class="small-label">ARCHIVE</p>
            <h2>受領記録</h2>
          </div>
          <button id="clearHistoryButton" class="text-button">記録消去</button>
        </div>

        <div id="historyList" class="history-list"></div>
      </section>
    </main>
  </div>

  <dialog id="commandDialog">
    <form method="dialog" class="dialog-card">
      <div class="section-heading">
        <div>
          <p class="small-label">PRESCRIPT DATABASE</p>
          <h2>指令管理</h2>
        </div>
        <button class="icon-button close-button" value="cancel" aria-label="閉じる">×</button>
      </div>

      <div class="input-row">
        <input id="commandInput" type="text" placeholder="例：卒論を30分進めよ。" autocomplete="off" />
        <button id="addCommandButton" type="button" class="primary-button compact">追加</button>
      </div>

      <div id="commandList" class="command-list"></div>

      <button id="resetCommandsButton" type="button" class="secondary-button full">初期指令に戻す</button>
    </form>
  </dialog>

  <script src="script.js"></script>
  <script src="presets.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
