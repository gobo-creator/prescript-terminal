<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>DAILY PRESCRIPT</title><link rel="stylesheet" href="schedule.css"></head><body><main class="shell"><header><a href="./" class="back">← PRESCRIPT TERMINAL</a><div class="eyebrow">PRESCRIPT ENGINE / DAILY PLANNER</div><h1>DAILY PRESCRIPT</h1><p>一日の指令を構築せよ。</p></header><section class="panel"><div class="fields"><label>日付<input id="date" type="date"></label><label>開始<input id="start" type="time" value="09:00"></label><label>終了<input id="end" type="time" value="18:00"></label><label>指令の時間（分）<input id="duration" type="number" min="5" max="480" step="5" value="45"></label><label>休憩（分）<input id="break" type="number" min="0" max="120" step="5" value="15"></label><label>使用プリセット<select id="preset"></select></label></div><div class="actions"><button id="generate">一日分を自動生成</button><button id="add">指令を一件抽選して追加</button></div><p class="hint">抽選はプリセットの比率を使用。固定予定の追加、各予定の再抽選・編集・削除も可能です。</p></section><section class="panel"><div class="heading"><h2>DAILY ARCHIVE</h2><span id="total"></span></div><div id="entries"></div><div class="actions"><button id="fixed">固定予定を追加</button><button id="clear" class="subtle">この日の予定を消去</button></div><p id="status" aria-live="polite"></p></section></main><script src="schedule.js"></script></body></html>
